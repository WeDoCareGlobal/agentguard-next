name: Pages

# Deploys the static docs site to GitHub Pages (main:/docs)
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy docs to Pages
        run: |
          # Pages serves from docs/ - it's already there
          echo "docs/ already contains index.html - Pages will serve it"
      - name: Commit and push (no-op, just trigger Pages rebuild)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(docs): trigger Pages rebuild [skip ci]"
          git push