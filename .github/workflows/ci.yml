name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install --break-system-packages -e ".[dev]"
          pip install --break-system-packages bandit pytest-cov
      - name: Lint
        run: ruff check agentguard/
      - name: Typecheck
        run: mypy agentguard/ --ignore-missing-imports
      - name: Security scan (bandit)
        run: bandit -r agentguard/ -f json -o bandit-report.json
      - name: Upload Bandit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-findings
          path: bandit-report.json
          if-no-files-found: warn
      - name: Security scan (pip-audit)
        run: |
          python -m pip install pip-audit
          python -m pip_audit --format json --output pip-audit-report.json
      - name: Upload dependency audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-findings
          path: pip-audit-report.json
          if-no-files-found: warn
      - name: Test with coverage
        run: python -m pytest tests/ -v --cov=agentguard --cov-report=xml --cov-fail-under=70 -m 'not integration'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: agentguard:test
          load: true

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Compose service and verify SQLite volume writes
        env:
          AGENTGUARD_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          AGENTGUARD_ADMIN_KEY: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          AGENTGUARD_AUDIT_KEY: "cccccccccccccccccccccccccccccccc"
          OMNIGUARD_API_KEY: "ci-placeholder-not-a-live-gateway"
          OMNIGUARD_BASE_URL: "http://127.0.0.1:9999/v1"
        run: |
          set -eu
          test ! -e policy.yaml || { echo 'Unexpected policy.yaml in clean CI checkout'; exit 1; }
          cp policy.example.yaml policy.yaml
          test -f policy.yaml
          docker compose config --quiet
          docker compose up --build -d
          trap 'docker compose logs --no-color; docker compose down --volumes' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/agentguard-health.json; then
              break
            fi
            sleep 3
          done
          python -c 'import json; h=json.load(open("/tmp/agentguard-health.json")); assert h["status"] == "ok" and h["omniguard_enabled"] is True'
          docker compose exec -T api python -c 'import sqlite3; db=sqlite3.connect("/app/data/audit.db"); db.execute("CREATE TABLE IF NOT EXISTS compose_smoke (value INTEGER)"); db.execute("INSERT INTO compose_smoke VALUES (42)"); db.commit(); db.close()'
          docker compose restart api
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 3
          done
          docker compose exec -T api python -c 'import sqlite3; db=sqlite3.connect("/app/data/audit.db"); assert db.execute("SELECT value FROM compose_smoke").fetchone()[0] == 42; db.close()'
