name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install --break-system-packages -e ".[dev]"
          pip install --break-system-packages bandit pytest-cov
      - name: Lint
        run: ruff check agentguard/
      - name: Typecheck
        run: mypy agentguard/ --ignore-missing-imports
      - name: Security scan (bandit)
        run: bandit -r agentguard/ -f json -o bandit-report.json
      - name: Upload Bandit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-findings
          path: bandit-report.json
          if-no-files-found: warn
      - name: Security scan (pip-audit)
        run: |
          python -m pip install pip-audit
          python -m pip_audit --format json --output pip-audit-report.json
      - name: Upload dependency vulnerability findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-findings
          path: pip-audit-report.json
          if-no-files-found: warn
      - name: Test with coverage
        run: python -m pytest tests/ -v --cov=agentguard --cov-report=xml --cov-fail-under=70 -m 'not integration'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: agentguard:test
          load: true