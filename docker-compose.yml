# Local development only. Do not expose this service directly to the internet.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./policy.yaml:/app/policy.yaml:ro
      - ./data:/app/data
    environment:
      AGENTGUARD_POLICY: /app/policy.yaml
      AGENTGUARD_DB_PATH: /app/data/audit.db
      AGENTGUARD_API_KEY: ${AGENTGUARD_API_KEY:?Set AGENTGUARD_API_KEY (32+ chars)}
      AGENTGUARD_ADMIN_KEY: ${AGENTGUARD_ADMIN_KEY:?Set AGENTGUARD_ADMIN_KEY (32+ chars)}
      AGENTGUARD_AUDIT_KEY: ${AGENTGUARD_AUDIT_KEY:?Set a stable independent audit key (32+ chars)}
      AGENTGUARD_OMNIGUARD: ${AGENTGUARD_OMNIGUARD:-false}
    restart: unless-stopped
