[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agentguard"
version = "1.0.0rc1"
description = "Security & Governance Control Plane for Autonomous AI Agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Emir Perla", email = "emirperla96@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "cryptography>=42,<47",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["ruff", "mypy", "bandit", "safety"]
[project.scripts]
agentguard = "agentguard.cli:app"
[tool.setuptools.packages.find]
include = ["agentguard*"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
